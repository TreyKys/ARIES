services:
  aries:
    build: .
    container_name: aries
    restart: unless-stopped
    env_file: .env
    # Paper portfolio by default. Flip to real only after paper proves out.
    command: >
      python run_aries.py --live
      --pairs ETHUSDT,SOLUSDT,LINKUSDT --tf 15m --capital 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
