services:
  aries:
    build: .
    container_name: aries
    restart: unless-stopped
    env_file: .env
    # Delta-neutral funding carry on OKX, in PAPER mode. This is the only
    # strategy in this repo that survived honest validation (6.7yr of real
    # funding history). The previous default here ran the hedged grid, which
    # an accounting bug made look profitable and which actually loses
    # -22%/yr -- see the correction at the top of DEPLOY.md.
    #
    # Expect 2-5%/yr in the current funding regime, NOT the 6.7yr average,
    # and expect negative-funding stretches. On $50 that is a few dollars a
    # year: the point of this run is to verify plumbing, not to earn.
    command: >
      python run_aries_carry.py --live
      --pairs ETHUSDT,BTCUSDT --capital 50 --leverage 2 --poll 300
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
